<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Your Cart — Faisalabad Textile Depot</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
    --bg: #f6f1e7;
    --card: #ffffff;
    --ink: #141414;
    --muted: #746f66;
    --border: #e7e0d3;
    --red: #b3121c;
    --red-dark: #8c0e16;
    --red-tint: rgba(179, 18, 28, 0.08);
    --green: #1e7e34;
    --amber: #b9791a;
    --whatsapp: #25d366;
    --sidebar-w: 250px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
}

html, body { height: 100%; }
body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100dvh;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
button { cursor: pointer; }

/* ===== Shell (same as dashboard) ===== */
.app-shell { display: flex; min-height: 100dvh; }
.content-column { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.sidebar {
    width: var(--sidebar-w); flex-shrink: 0; background: var(--ink); color: #fff;
    display: flex; flex-direction: column; padding: calc(20px + var(--safe-t)) 18px 20px;
    position: sticky; top: 0; height: 100dvh; overflow-y: auto;
}
.sidebar-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 26px; }
.brand-mark {
    width: auto;          /* was 30px */
    min-width: 30px;
    height: 30px;
    padding: 0 8px;       /* gives 3-letter text breathing room */
    border-radius: 7px;
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
}
.brand-mark span {
    color: #fff;
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: 0.72rem;   /* was 0.95rem — smaller so 3 letters fit */
    letter-spacing: 0.3px;
}

.brand-name { font-family: 'Playfair Display', serif; font-size: 1.02rem; font-weight: 800; line-height: 1.2; }

.sidebar-account { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 14px; margin-bottom: 22px; display: flex; align-items: center; gap: 12px; }
.account-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--red); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.95rem; flex-shrink: 0; color: #fff; }
.account-info { min-width: 0; }
.account-name { font-size: 0.86rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.account-email { font-size: 0.7rem; color: #b8b3a8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sidebar-nav { list-style: none; display: flex; flex-direction: column; gap: 3px; margin-bottom: 20px; }
.sidebar-nav a, .sidebar-nav button {
    display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 9px;
    color: #e9e5db; text-decoration: none; font-size: 0.85rem; font-weight: 600;
    background: none; border: none; width: 100%; text-align: left; font-family: inherit; position: relative;
}
.sidebar-nav a:hover, .sidebar-nav button:hover { background: rgba(255,255,255,0.08); }
.sidebar-nav a.active { background: var(--red); color: #fff; }
.sidebar-nav .icon { width: 18px; text-align: center; flex-shrink: 0; opacity: 0.9; }
.nav-badge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--red); color: #fff; font-size: 0.66rem; font-weight: 800; display: none; align-items: center; justify-content: center; line-height: 1; }
.nav-badge.show { display: inline-flex; }
.sidebar-nav a.active .nav-badge { background: #fff; color: var(--red); }
.sidebar-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 6px 0 16px; }
.sidebar-logout { margin-top: auto; padding-top: 14px; }
.sidebar-logout a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; color: #f3b8bb; text-decoration: none; font-size: 0.84rem; font-weight: 700; border: 1px solid rgba(179,18,28,0.35); }
.sidebar-logout a:hover { background: rgba(179,18,28,0.15); }
@media (max-width: 900px) { .sidebar { display: none; } }

.mobile-topbar { display: none; background: var(--bg); padding: calc(10px + var(--safe-t)) 14px 6px; position: sticky; top: 0; z-index: 40; align-items: center; justify-content: space-between; }
.mobile-topbar .hamburger-btn { width: 38px; height: 38px; border-radius: 9px; background: var(--ink); border: none; color: #fff; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(20,20,20,0.18); }
.mobile-topbar .page-title { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 1.05rem; }
@media (max-width: 900px) { .mobile-topbar { display: flex; } }

.drawer-overlay { position: fixed; inset: 0; background: rgba(10,10,10,0.55); display: none; z-index: 80; }
.drawer-overlay.open { display: block; }
.drawer-panel { position: fixed; top: 0; left: 0; bottom: 0; width: 82%; max-width: 300px; background: var(--ink); color: #fff; padding: calc(18px + var(--safe-t)) 16px calc(18px + var(--safe-b)); transform: translateX(-100%); transition: transform 0.25s ease; display: flex; flex-direction: column; z-index: 90; overflow-y: auto; }
.drawer-overlay.open .drawer-panel { transform: translateX(0); }
.drawer-close { align-self: flex-end; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.08); border: none; color: #fff; font-size: 1.1rem; margin-bottom: 10px; }

/* ===== Main content ===== */
.main-content { flex: 1; min-width: 0; padding: 22px 26px calc(120px + var(--safe-b)); max-width: 1100px; }
@media (max-width: 900px) { .main-content { padding: 10px 14px calc(120px + var(--safe-b)); } }

.content-head { margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.content-head .eyebrow { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--red); margin-bottom: 3px; }
.content-head h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 800; }
.select-all-btn { background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 8px 14px; font-size: 0.78rem; font-weight: 700; color: var(--ink); font-family: inherit; white-space: nowrap; }
.select-all-btn:hover { background: var(--red-tint); border-color: rgba(179,18,28,0.25); }

.cart-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1000px) { .cart-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px)  { .cart-grid { grid-template-columns: 1fr; gap: 16px; } }

.product-card {
    display: flex; flex-direction: column; background: var(--card); border-radius: 14px;
    border: 2px solid var(--border); overflow: hidden;
    box-shadow: 0 1px 3px rgba(20,20,20,0.05), 0 8px 20px rgba(20,20,20,0.04);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    position: relative;
}
.product-card.selected { border-color: var(--red); box-shadow: 0 0 0 3px var(--red-tint); }

.select-toggle {
    position: absolute; top: 8px; left: 8px; z-index: 4;
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255,255,255,0.92); border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 0.85rem; color: transparent;
}
.select-toggle.checked { background: var(--red); border-color: var(--red); color: #fff; }

.card-image-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #efe9db; overflow: hidden; touch-action: pan-y; cursor: zoom-in; }
.card-image-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; transition: transform 0.35s ease, opacity 0.25s ease; opacity: 0; }
.card-image-wrap img.active { display: block; }
.card-image-wrap img.loaded { opacity: 1; }
.card-image-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.72rem; }

.carousel-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%; background: rgba(20,20,20,0.55); color: #fff; border: none; font-size: 0.82rem; display: flex; align-items: center; justify-content: center; z-index: 2; }
.carousel-nav.prev { left: 6px; } .carousel-nav.next { right: 6px; }
.carousel-dots { position: absolute; bottom: 6px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; z-index: 2; }
.carousel-dots .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.55); }
.carousel-dots .dot.active { background: #fff; }
.image-count-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(20,20,20,0.6); color: #fff; font-size: 0.62rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; z-index: 2; }

.discount-ribbon { position: absolute; top: 14px; left: -38px; width: 140px; padding: 5px 0 4px; background: linear-gradient(135deg, var(--red), var(--red-dark)); color: #fff; text-align: center; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; transform: rotate(-45deg); transform-origin: center; box-shadow: 0 3px 8px rgba(0,0,0,0.3); z-index: 3; }
.card-badges { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; z-index: 3; }
.badge { display: inline-block; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; padding: 3px 7px; border-radius: 999px; background: rgba(255,255,255,0.92); }
.badge.out { background: #fbe6e6; color: var(--red); }

.card-body { display: flex; flex-direction: column; flex: 1; padding: 9px 10px 10px; border-top: 1px solid var(--border); position: relative; }
.card-body::before { content: ''; position: absolute; top: -1px; left: 0; width: 34px; height: 2px; background: var(--red); }
.category-pill { display: inline-block; align-self: flex-start; background: var(--red-tint); color: var(--red); border: 1px solid rgba(179,18,28,0.18); border-radius: 999px; padding: 2px 8px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 4px; }
.card-title { font-size: 0.9rem; font-weight: 700; line-height: 1.25; margin-bottom: 5px; }

.price-block { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.price-main { display: inline-flex; align-items: baseline; gap: 1px; font-weight: 800; color: var(--red); line-height: 1; }
.price-main .currency { font-size: 0.62rem; font-weight: 700; margin-right: 2px; opacity: 0.85; }
.price-main .amount { font-size: 1.05rem; letter-spacing: -0.2px; }
.price-was { font-size: 0.7rem; color: var(--muted); text-decoration: line-through; font-weight: 500; }
.discount-chip { display: inline-flex; align-items: center; background: var(--red-tint); color: var(--red); border-radius: 5px; padding: 1px 6px; font-size: 0.62rem; font-weight: 800; }

.card-sub { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: var(--muted); margin-bottom: 8px; }
.stock-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.stock-dot.low { background: var(--amber); }
.stock-dot.out { background: var(--red); }

.card-actions { margin-top: auto; display: flex; gap: 6px; }
.card-actions .remove-btn {
    flex: 1; height: 34px; border-radius: 7px; border: 1px solid var(--red);
    background: #fff; color: var(--red); font-size: 0.74rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 5px; font-family: inherit;
    transition: background 0.15s ease;
}
.card-actions .remove-btn:hover { background: var(--red-tint); }
.card-actions .remove-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.card-actions .select-btn {
    flex: 1; height: 34px; border-radius: 7px; border: none;
    background: var(--red); color: #fff; font-size: 0.74rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center; font-family: inherit;
}
.card-actions .select-btn.selected { background: var(--ink); }

.unavailable-note { font-size: 0.68rem; color: var(--red); font-weight: 700; margin-bottom: 6px; }

.state-msg { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 60px 20px; }
.state-msg a { color: var(--red); font-weight: 700; text-decoration: underline; }

/* ===== Sticky checkout bar ===== */
.checkout-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    background: var(--ink); color: #fff;
    padding: 14px 20px calc(14px + var(--safe-b));
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    transform: translateY(100%); transition: transform 0.25s ease;
    box-shadow: 0 -6px 20px rgba(0,0,0,0.15);
}
.checkout-bar.show { transform: translateY(0); }
.checkout-bar .cb-left { font-size: 0.85rem; }
.checkout-bar .cb-left .cb-count { font-weight: 800; color: #fff; }
.checkout-bar .cb-left .cb-total { color: #cfc9bd; font-size: 0.78rem; }
.checkout-bar .cb-btn { background: var(--red); color: #fff; border: none; border-radius: 9px; padding: 12px 22px; font-size: 0.85rem; font-weight: 800; font-family: inherit; white-space: nowrap; }
.checkout-bar .cb-btn:hover { background: var(--red-dark); }
@media (left: 900px) { .checkout-bar { left: var(--sidebar-w); } }
@media (min-width: 901px) { .checkout-bar { left: var(--sidebar-w); } }

.lightbox-overlay { position: fixed; inset: 0; background: rgba(10,10,10,0.94); display: none; align-items: center; justify-content: center; z-index: 400; touch-action: pan-y; }
.lightbox-overlay.open { display: flex; }
.lightbox-overlay img { max-width: 94vw; max-height: 86vh; object-fit: contain; border-radius: 6px; user-select: none; -webkit-user-drag: none; }
.lightbox-close { position: absolute; top: calc(16px + var(--safe-t)); right: 16px; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.12); color: #fff; border: none; font-size: 1.3rem; z-index: 2; }
.lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.12); color: #fff; border: none; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; z-index: 2; }
.lightbox-nav.prev { left: 14px; } .lightbox-nav.next { right: 14px; }
.lightbox-counter { position: absolute; bottom: calc(18px + var(--safe-b)); left: 0; right: 0; text-align: center; color: rgba(255,255,255,0.75); font-size: 0.8rem; z-index: 2; }

.toast { position: fixed; left: 50%; bottom: calc(94px + var(--safe-b)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 0.82rem; opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 500; pointer-events: none; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <a href="/dashboard" class="sidebar-brand">
            <div class="brand-mark"><span>FTD</span></div>
            <span class="brand-name">Faisalabad<br/>Textile Depot</span>
        </a>
        <div class="sidebar-account">
            <div class="account-avatar" id="accountAvatar">•</div>
            <div class="account-info">
                <div class="account-name" id="accountName">Loading…</div>
                <div class="account-email" id="accountEmail">&nbsp;</div>
            </div>
        </div>
        <ul class="sidebar-nav">
            <li><a href="/dashboard"><span class="icon">&#8962;</span> Shop</a></li>
            <li><a href="/user-cart" class="active"><span class="icon">&#128722;</span> Cart <span class="nav-badge" id="cartBadge">0</span></a></li>
            <li><a href="/user-order"><span class="icon">&#128230;</span> My Orders</a></li>
        </ul>
        <div class="sidebar-divider"></div>
        <div class="sidebar-logout"><a href="/logout"><span class="icon">&#8592;</span> Log out</a></div>
    </aside>

    <div class="content-column">
        <div class="mobile-topbar">
            <button type="button" class="hamburger-btn" id="drawerOpenBtn" aria-label="Open menu">&#9776;</button>
            <span class="page-title">Your Cart</span>
            <span style="width:38px;"></span>
        </div>

        <main class="main-content">
            <div class="content-head">
                <div>
                    <div class="eyebrow">Your Selections</div>
                    <h1>Cart</h1>
                </div>
                <button type="button" class="select-all-btn" id="selectAllBtn">Select All</button>
            </div>

            <div id="cartGrid" class="cart-grid"></div>
        </main>
    </div>
</div>

<div class="drawer-overlay" id="drawerOverlay">
    <div class="drawer-panel">
        <button type="button" class="drawer-close" id="drawerCloseBtn" aria-label="Close menu">&times;</button>
        <a href="/dashboard" class="sidebar-brand">
            <div class="brand-mark"><span>FTD</span></div>
            <span class="brand-name">Faisalabad<br/>Textile Depot</span>
        </a>
        <ul class="sidebar-nav">
            <li><a href="/dashboard"><span class="icon">&#8962;</span> Shop</a></li>
            <li><a href="/user-cart" class="active"><span class="icon">&#128722;</span> Cart</a></li>
            <li><a href="/user-order"><span class="icon">&#128230;</span> My Orders</a></li>
        </ul>
        <div class="sidebar-divider"></div>
        <div class="sidebar-logout"><a href="/"><span class="icon">&#8592;</span> Log out</a></div>
    </div>
</div>

<div class="lightbox-overlay" id="lightboxOverlay">
    <button class="lightbox-close" id="lightboxClose">&times;</button>
    <button class="lightbox-nav prev" id="lightboxPrev">&#8249;</button>
    <img id="lightboxImg" src="" alt="" />
    <button class="lightbox-nav next" id="lightboxNext">&#8250;</button>
    <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

<div class="checkout-bar" id="checkoutBar">
    <div class="cb-left">
        <div><span class="cb-count" id="cbCount">0</span> item(s) selected</div>
        <div class="cb-total" id="cbTotal">Rs. 0</div>
    </div>
    <button type="button" class="cb-btn" id="checkoutBtn">Proceed to Checkout</button>
</div>

<script>
function showToast(message) {
    let toast = document.getElementById('toast');
    if (!toast) { toast = document.createElement('div'); toast.id = 'toast'; toast.className = 'toast'; document.body.appendChild(toast); }
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toast._hideTimer);
    toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

async function apiFetch(url, options = {}) {
    try {
        const res = await fetch(url, { credentials: 'include', ...options });
        let body;
        try { body = await res.json(); } catch { body = { success: false, message: 'Invalid server response' }; }
        if (res.status === 401 || res.status === 403) {
            showToast(body.message || 'Session expired — please log in again');
            setTimeout(() => (window.location.href = '/login'), 1200);
            throw new Error(body.message || 'Unauthorized');
        }
        return body;
    } catch (err) {
        return { success: false, message: err.message || 'Network error' };
    }
}

function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const LOW_STOCK_DEFAULT = 10;
const CHECKOUT_KEY = 'checkoutItems';

let cartItems = [];
let selected = new Set();
let cartItemImages = {};

async function loadAccount() {
    const res = await apiFetch('/api/user/profile');
    const name = (res.success && res.data && res.data.full_name) || 'Guest';
    const email = (res.success && res.data && res.data.email) || '';
    document.getElementById('accountName').textContent = name;
    document.getElementById('accountEmail').textContent = email;
    document.getElementById('accountAvatar').textContent = name.trim().charAt(0).toUpperCase() || '•';
}

async function refreshCartBadge() {
    const res = await apiFetch('/api/cart/count');
    const count = (res.success && res.data && res.data.item_count) || 0;
    const el = document.getElementById('cartBadge');
    el.textContent = count > 99 ? '99+' : count;
    el.classList.toggle('show', count > 0);
}

async function loadCart() {
    const grid = document.getElementById('cartGrid');
    grid.innerHTML = '<p class="state-msg">Loading your cart…</p>';

    const res = await apiFetch('/api/cart');
    if (!res.success) {
        grid.innerHTML = '<p class="state-msg">Could not load your cart. Please try again.</p>';
        return;
    }

    cartItems = (res.data && res.data.items) || [];

    if (!cartItems.length) {
        grid.innerHTML = '<p class="state-msg">Your cart is empty. <a href="/dashboard">Browse the collection →</a></p>';
        updateCheckoutBar();
        return;
    }

    grid.innerHTML = '';
    cartItems.forEach(renderCartCard);
    updateCheckoutBar();
}

function renderCartCard(item) {
    const cardId = `cart-card-${item.cart_item_id}`;
    const images = item.images && item.images.length ? item.images : (item.image ? [item.image] : []);
    cartItemImages[item.cart_item_id] = images;

    const imagesHtml = images.length
        ? images.map((url, i) => `<img src="${escapeHtml(url)}" loading="lazy" decoding="async" class="${i === 0 ? 'active' : ''}" data-i="${i}" onload="this.classList.add('loaded')" onerror="this.style.display='none'" />`).join('')
        : '<div class="card-image-placeholder">No image</div>';

    const navHtml = images.length > 1 ? `
        <button type="button" class="carousel-nav prev" onclick="changeImage(event, '${cardId}', -1)">&#8249;</button>
        <button type="button" class="carousel-nav next" onclick="changeImage(event, '${cardId}', 1)">&#8250;</button>
        <div class="carousel-dots">${images.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}"></div>`).join('')}</div>
    ` : '';
    const countBadge = images.length > 1 ? `<div class="image-count-badge">${images.length} photos</div>` : '';

    const priceHtml = item.has_discount
        ? `<div class="price-block">
             <span class="price-main"><span class="currency">Rs.</span><span class="amount">${Number(item.discounted_price).toLocaleString()}</span></span>
             <span class="price-was">Rs. ${Number(item.price).toLocaleString()}</span>
             <span class="discount-chip">-${Number(item.discount_percentage)}%</span>
           </div>`
        : `<div class="price-block"><span class="price-main"><span class="currency">Rs.</span><span class="amount">${Number(item.price).toLocaleString()}</span></span></div>`;

    const soldOut = Number(item.stock) <= 0 || !item.is_active;
    const stockClass = soldOut ? 'out' : (Number(item.stock) <= (item.low_stock_threshold || LOW_STOCK_DEFAULT) ? 'low' : '');
    const isSelected = selected.has(item.cart_item_id);

    const card = document.createElement('div');
    card.className = `product-card${isSelected ? ' selected' : ''}`;
    card.id = `wrap-${cardId}`;
    card.innerHTML = `
        <button type="button" class="select-toggle${isSelected ? ' checked' : ''}" id="toggle-${item.cart_item_id}"
                onclick="toggleSelect(${item.cart_item_id}, ${soldOut ? 'true' : 'false'})" ${soldOut ? 'disabled' : ''}>&#10003;</button>
        <div class="card-image-wrap" id="${cardId}"
             onclick="openLightbox(${item.cart_item_id}, '${cardId}')"
             ontouchstart="cardTouchStart(event, '${cardId}')"
             ontouchend="cardTouchEnd(event, '${cardId}')">
            <div class="card-badges">${soldOut ? '<span class="badge out">' + (item.is_active ? 'Sold out' : 'Unavailable') + '</span>' : ''}</div>
            ${imagesHtml}
            ${navHtml}
            ${countBadge}
        </div>
        <div class="card-body">
            <span class="category-pill">${escapeHtml(item.category_name || '')}</span>
            <div class="card-title">${escapeHtml(item.product_name)}</div>
            ${priceHtml}
            <div class="card-sub"><span class="stock-dot ${stockClass}"></span>${soldOut ? (item.is_active ? 'Out of stock' : 'No longer available') : 'In stock'}</div>
            <div class="card-actions">
                <button class="remove-btn" onclick="removeFromCart(${item.cart_item_id}, this)">&#10005; Remove from Cart</button>
                <button class="select-btn${isSelected ? ' selected' : ''}" id="selbtn-${item.cart_item_id}" ${soldOut ? 'disabled' : ''}
                        onclick="toggleSelect(${item.cart_item_id}, ${soldOut ? 'true' : 'false'})">${isSelected ? '&#10003; Selected' : 'Add to Order'}</button>
            </div>
        </div>
    `;
    document.getElementById('cartGrid').appendChild(card);
}

/* ----- in-card image carousel ----- */
function changeImage(evt, cardId, delta) {
    evt.stopPropagation();
    const wrap = document.getElementById(cardId);
    const imgs = Array.from(wrap.querySelectorAll('img'));
    if (imgs.length < 2) return;
    let current = imgs.findIndex(img => img.classList.contains('active'));
    imgs[current].classList.remove('active');
    current = (current + delta + imgs.length) % imgs.length;
    imgs[current].classList.add('active');
    wrap.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
}
const cardTouch = {};
function cardTouchStart(evt, cardId) { cardTouch[cardId] = evt.changedTouches[0].clientX; }
function cardTouchEnd(evt, cardId) {
    const startX = cardTouch[cardId];
    if (startX === undefined) return;
    const diff = evt.changedTouches[0].clientX - startX;
    if (Math.abs(diff) > 40) { evt.stopPropagation(); changeImage(evt, cardId, diff < 0 ? 1 : -1); }
    delete cardTouch[cardId];
}

/* ----- fullscreen lightbox (shows every image for the product) ----- */
let lightboxImages = [];
let lightboxIndex = 0;
function openLightbox(cartItemId, cardId) {
    const images = cartItemImages[cartItemId] || [];
    if (!images.length) return;
    const wrap = document.getElementById(cardId);
    const activeImg = wrap ? wrap.querySelector('img.active') : null;
    lightboxImages = images;
    lightboxIndex = activeImg ? Number(activeImg.dataset.i) : 0;
    renderLightbox();
    document.getElementById('lightboxOverlay').classList.add('open');
}
function renderLightbox() {
    document.getElementById('lightboxImg').src = lightboxImages[lightboxIndex];
    const multi = lightboxImages.length > 1;
    document.getElementById('lightboxPrev').style.display = multi ? 'flex' : 'none';
    document.getElementById('lightboxNext').style.display = multi ? 'flex' : 'none';
    document.getElementById('lightboxCounter').textContent = multi ? `${lightboxIndex + 1} / ${lightboxImages.length}` : '';
}
function lightboxChange(delta) { lightboxIndex = (lightboxIndex + delta + lightboxImages.length) % lightboxImages.length; renderLightbox(); }
function closeLightbox() { document.getElementById('lightboxOverlay').classList.remove('open'); }
document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
document.getElementById('lightboxPrev').addEventListener('click', () => lightboxChange(-1));
document.getElementById('lightboxNext').addEventListener('click', () => lightboxChange(1));
document.getElementById('lightboxOverlay').addEventListener('click', (e) => { if (e.target.id === 'lightboxOverlay') closeLightbox(); });
document.addEventListener('keydown', (e) => {
    if (!document.getElementById('lightboxOverlay').classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') lightboxChange(-1);
    if (e.key === 'ArrowRight') lightboxChange(1);
});
let lightboxTouchStartX = null;
document.getElementById('lightboxOverlay').addEventListener('touchstart', (e) => { lightboxTouchStartX = e.changedTouches[0].clientX; });
document.getElementById('lightboxOverlay').addEventListener('touchend', (e) => {
    if (lightboxTouchStartX === null) return;
    const diff = e.changedTouches[0].clientX - lightboxTouchStartX;
    if (Math.abs(diff) > 50) lightboxChange(diff < 0 ? 1 : -1);
    lightboxTouchStartX = null;
});

/* ----- select-for-checkout ----- */
function toggleSelect(cartItemId, disabled) {
    if (disabled) return;
    if (selected.has(cartItemId)) selected.delete(cartItemId); else selected.add(cartItemId);

    const toggleBtn = document.getElementById(`toggle-${cartItemId}`);
    const selBtn = document.getElementById(`selbtn-${cartItemId}`);
    const wrap = document.getElementById(`wrap-cart-card-${cartItemId}`);
    const isSel = selected.has(cartItemId);
    if (toggleBtn) toggleBtn.classList.toggle('checked', isSel);
    if (selBtn) { selBtn.classList.toggle('selected', isSel); selBtn.innerHTML = isSel ? '&#10003; Selected' : 'Add to Order'; }
    if (wrap) wrap.classList.toggle('selected', isSel);

    updateCheckoutBar();
}

document.getElementById('selectAllBtn').addEventListener('click', () => {
    const selectable = cartItems.filter(i => Number(i.stock) > 0 && i.is_active);
    const allSelected = selectable.length && selectable.every(i => selected.has(i.cart_item_id));
    if (allSelected) {
        selected.clear();
    } else {
        selectable.forEach(i => selected.add(i.cart_item_id));
    }
    document.querySelectorAll('.select-toggle').forEach(btn => {
        const id = Number(btn.id.replace('toggle-', ''));
        btn.classList.toggle('checked', selected.has(id));
    });
    document.querySelectorAll('[id^="selbtn-"]').forEach(btn => {
        const id = Number(btn.id.replace('selbtn-', ''));
        const isSel = selected.has(id);
        btn.classList.toggle('selected', isSel);
        btn.innerHTML = isSel ? '&#10003; Selected' : 'Add to Order';
    });
    document.querySelectorAll('.product-card').forEach(card => {
        const id = Number(card.id.replace('wrap-cart-card-', ''));
        card.classList.toggle('selected', selected.has(id));
    });
    updateCheckoutBar();
});

function updateCheckoutBar() {
    const bar = document.getElementById('checkoutBar');
    const chosen = cartItems.filter(i => selected.has(i.cart_item_id));
    if (!chosen.length) { bar.classList.remove('show'); return; }
    const total = chosen.reduce((s, i) => s + Number(i.discounted_price), 0);
    document.getElementById('cbCount').textContent = chosen.length;
    document.getElementById('cbTotal').textContent = `Rs. ${total.toLocaleString()}`;
    bar.classList.add('show');
}

document.getElementById('checkoutBtn').addEventListener('click', () => {
    const chosen = cartItems.filter(i => selected.has(i.cart_item_id)).map(i => i.product_id);
    if (!chosen.length) return;
    sessionStorage.setItem(CHECKOUT_KEY, JSON.stringify(chosen));
    window.location.href = '/checkout';
});

/* ----- remove ----- */
async function removeFromCart(cartItemId, btnEl) {
    btnEl.disabled = true;
    const res = await apiFetch(`/api/cart/${cartItemId}`, { method: 'DELETE' });
    if (res.success) {
        selected.delete(cartItemId);
        showToast('Removed from cart');
        await loadCart();
        refreshCartBadge();
    } else {
        btnEl.disabled = false;
        showToast(res.message || 'Could not remove item');
    }
}

/* ----- drawer ----- */
const drawerOverlay = document.getElementById('drawerOverlay');
document.getElementById('drawerOpenBtn').addEventListener('click', () => drawerOverlay.classList.add('open'));
document.getElementById('drawerCloseBtn').addEventListener('click', () => drawerOverlay.classList.remove('open'));
drawerOverlay.addEventListener('click', (e) => { if (e.target === drawerOverlay) drawerOverlay.classList.remove('open'); });

/* ----- init ----- */
async function init() {
    loadAccount();
    refreshCartBadge();
    await loadCart();
}
init();
</script>
