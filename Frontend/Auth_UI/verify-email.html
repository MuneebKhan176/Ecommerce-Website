<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
  <title>Faisalabad Textile Depot — Verify Email</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #f6f1e7;
      --card: #ffffff;
      --ink: #141414;
      --muted: #746f66;
      --border: #e7e0d3;
      --input-bg: #faf7f0;
      --red: #b3121c;
      --red-dark: #8c0e16;
      --red-soft: rgba(179, 18, 28, 0.08);
      --success: #1c8a4a;
      --radius: 12px;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .app-header {
      padding: calc(18px + var(--safe-t)) 20px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: auto;          /* was 30px */
      min-width: 30px;
      height: 30px;
      padding: 0 8px;       /* gives 3-letter text breathing room */
      border-radius: 7px;
      background: var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
    }

  .brand-mark span {
      color: #fff;
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 0.72rem;   /* was 0.95rem — smaller so 3 letters fit */
      letter-spacing: 0.3px;
  }
   

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 8px 20px 24px;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 800;
      margin-top: 10px;
    }

    .card-subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 6px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 0.87rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .input-wrapper { position: relative; }

    input[type="email"] {
      width: 100%;
      padding: 15px;
      font-size: 16px; /* keeps iOS Safari from auto-zooming on focus */
      font-family: inherit;
      color: var(--ink);
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      min-height: 52px;
    }

    input::placeholder { color: #a39d8f; }

    input:focus {
      border-color: var(--red);
      background: #fff;
      box-shadow: 0 0 0 3px var(--red-soft);
    }

    /* Code boxes — sized generously for thumbs */
    .code-row {
      display: flex;
      gap: 8px;
      justify-content: space-between;
    }

    .code-box {
      width: 100%;
      height: 58px;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      font-family: inherit;
      color: var(--ink);
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .code-box:focus {
      border-color: var(--red);
      background: #fff;
      box-shadow: 0 0 0 3px var(--red-soft);
    }

    .code-hint {
      margin-top: 10px;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .resend-row {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .resend-row button {
      background: none;
      border: none;
      color: var(--red);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 6px;
    }

    .resend-row button:disabled {
      color: var(--muted);
      cursor: default;
    }

    .cta-area {
      padding: 14px 20px calc(16px + var(--safe-b));
      background: linear-gradient(180deg, rgba(246,241,231,0) 0%, var(--bg) 30%);
      position: sticky;
      bottom: 0;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: var(--red);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(179, 18, 28, 0.25);
      min-height: 52px;
    }

    .btn-primary:active { transform: scale(0.98); background: var(--red-dark); }

    /* Status message */
    .message {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      min-height: 18px;
      margin-top: 16px;
    }

    .message.success { color: var(--success); }
    .message.error { color: var(--red); }

    .card-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .card-footer a {
      color: var(--red);
      font-weight: 700;
      text-decoration: none;
    }

    .card-footer a:hover { text-decoration: underline; }

    @media (min-width: 520px) {
      body { align-items: center; justify-content: center; }
      .app-header { display: none; }
      .app-content {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 34px 32px 8px;
        box-shadow: 0 10px 40px rgba(20, 20, 20, 0.08);
        margin-top: 40px;
      }
      .card-title { margin-top: 0; text-align: center; }
      .card-subtitle { text-align: center; }
      .cta-area { position: static; background: none; padding: 14px 32px 32px; }
    }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="brand-mark"><span>FTD</span></div>
    <span class="brand-name">Faisalabad Textile Store</span>
  </div>

  <div class="app-content">
    <h1 class="card-title">Verify your email</h1>
    <p class="card-subtitle">Enter the 6-digit code we sent to your inbox. It expires in 10 minutes.</p>

    <form id="verifyForm" novalidate>

      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required readonly />
        </div>
      </div>

      <div class="form-group">
        <label for="code-0">Verification code</label>
        <div class="code-row">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box" id="code-0" autofocus />
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box" />
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box" />
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box" />
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box" />
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="code-box" />
        </div>
        <p class="code-hint">You can paste the full code into any box.</p>
      </div>
    </form>

    <div class="resend-row">
      Didn't get a code?
      <button type="button" id="resendBtn" onclick="resendCode()">Resend code</button>
    </div>

    <p id="message" class="message"></p>

    <div class="card-footer">
      Wrong email? <a href="/register">Go back</a>
    </div>
  </div>

  <div class="cta-area">
    <button type="submit" form="verifyForm" class="btn-primary">Verify account</button>
  </div>

  <script>
    document.getElementById('email').value = new URLSearchParams(location.search).get('email') || '';

    const codeBoxes = Array.from(document.querySelectorAll('.code-box'));

    codeBoxes.forEach((box, idx) => {
      box.addEventListener('input', () => {
        box.value = box.value.replace(/[^0-9]/g, '').slice(0, 1);
        if (box.value && idx < codeBoxes.length - 1) codeBoxes[idx + 1].focus();
      });

      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !box.value && idx > 0) codeBoxes[idx - 1].focus();
      });

      box.addEventListener('paste', (e) => {
        e.preventDefault();
        const digits = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').slice(0, 6);
        digits.split('').forEach((digit, i) => { if (codeBoxes[i]) codeBoxes[i].value = digit; });
        const last = codeBoxes[Math.min(digits.length, codeBoxes.length) - 1];
        if (last) last.focus();
      });
    });

    const messageEl = document.getElementById('message');

    document.getElementById('verifyForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const code = codeBoxes.map(box => box.value).join('');

      if (code.length < 6) {
        messageEl.textContent = 'Enter all 6 digits';
        messageEl.className = 'message error';
        return;
      }

      const body = new URLSearchParams({ email, code });
      const res = await fetch('/verify-email', { method: 'POST', body });
      const data = await res.json();

      messageEl.textContent = data.message;
      messageEl.className = 'message ' + (data.success ? 'success' : 'error');

      if (data.success) {
        setTimeout(() => {
          window.location.href = (data.data && data.data.redirectTo) ? data.data.redirectTo : '/dashboard';
        }, 1000);
      }
    });

    async function resendCode() {
      const email = document.getElementById('email').value.trim();
      if (!email) return;

      const btn = document.getElementById('resendBtn');
      btn.disabled = true;

      try {
        const res = await fetch('/resend-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `email=${encodeURIComponent(email)}`
        });
        const data = await res.json();

        messageEl.textContent = data.message;
        messageEl.className = 'message ' + (data.success ? 'success' : 'error');
      } catch (err) {
        messageEl.textContent = 'Network error. Please try again.';
        messageEl.className = 'message error';
      }

      let seconds = 30;
      const originalText = 'Resend code';
      const timer = setInterval(() => {
        btn.textContent = `Resend in ${seconds}s`;
        seconds--;
        if (seconds < 0) {
          clearInterval(timer);
          btn.textContent = originalText;
          btn.disabled = false;
        }
      }, 1000);
    }
  </script>

</body>
</html>
