<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
  <title>Bin-Sarfraz-Store — Create Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #f6f1e7;
      --card: #ffffff;
      --ink: #141414;
      --muted: #746f66;
      --border: #e7e0d3;
      --input-bg: #faf7f0;
      --red: #b3121c;
      --red-dark: #8c0e16;
      --red-soft: rgba(179, 18, 28, 0.08);
      --radius: 12px;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .app-header {
      padding: calc(18px + var(--safe-t)) 20px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
    width: auto;          /* was 30px */
    min-width: 30px;
    height: 30px;
    padding: 0 8px;       /* gives 3-letter text breathing room */
    border-radius: 7px;
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .brand-mark span {
    color: #fff;
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: 0.72rem;   /* was 0.95rem — smaller so 3 letters fit */
    letter-spacing: 0.3px;
  }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 8px 20px 24px;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 800;
      margin-top: 10px;
    }

    .card-subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 6px;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.87rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .input-wrapper { position: relative; }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"] {
      width: 100%;
      padding: 15px 46px 15px 15px;
      font-size: 16px; /* keeps iOS Safari from auto-zooming on focus */
      font-family: inherit;
      color: var(--ink);
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      min-height: 52px;
    }

    input::placeholder { color: #a39d8f; }

    input:focus {
      border-color: var(--red);
      background: #fff;
      box-shadow: 0 0 0 3px var(--red-soft);
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px;
      margin: -10px;
      display: flex;
      align-items: center;
      color: var(--muted);
    }

    .toggle-pw:hover { color: var(--red); }
    .toggle-pw svg { width: 18px; height: 18px; }

    .hint {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .cta-area {
      padding: 14px 20px calc(16px + var(--safe-b));
      background: linear-gradient(180deg, rgba(246,241,231,0) 0%, var(--bg) 30%);
      position: sticky;
      bottom: 0;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: var(--red);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(179, 18, 28, 0.25);
      min-height: 52px;
    }

    .btn-primary:active { transform: scale(0.98); background: var(--red-dark); }

    .card-footer {
      text-align: center;
      margin-top: 16px;
      font-size: 0.87rem;
      color: var(--muted);
    }

    .card-footer a {
      color: var(--red);
      font-weight: 700;
      text-decoration: none;
    }

    .card-footer a:hover { text-decoration: underline; }

    @media (min-width: 520px) {
      body { align-items: center; justify-content: center; }
      .app-header { display: none; }
      .app-content {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 34px 32px 8px;
        box-shadow: 0 10px 40px rgba(20, 20, 20, 0.08);
        margin-top: 40px;
      }
      .card-title { margin-top: 0; text-align: center; }
      .card-subtitle { text-align: center; }
      .cta-area { position: static; background: none; padding: 14px 32px 32px; }
    }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="brand-mark"><span>FTD</span></div>
    <span class="brand-name">Faisalabad Textile Depot</span>
  </div>

  <div class="app-content">
    <h1 class="card-title">Create an account</h1>
    <p class="card-subtitle">Join Faisalabad Textile Store to shop, track orders, and save your favorites.</p>

    <form id="registerForm" novalidate>

      <div class="form-group">
        <label for="fullName">Full name</label>
        <div class="input-wrapper">
          <input type="text" id="fullName" name="fullName" placeholder="Jane Carter" autocomplete="name" required />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
      </div>

      <div class="form-group">
        <label for="phone">Phone <span style="font-weight:400; color: var(--muted);">(optional)</span></label>
        <div class="input-wrapper">
          <input type="tel" id="phone" name="phone" placeholder="+1 555 123 4567" autocomplete="tel" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required />
          <button type="button" class="toggle-pw" onclick="togglePassword('password', this)" aria-label="Toggle password visibility">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
        <p class="hint">At least 8 characters.</p>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <div class="input-wrapper">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" autocomplete="new-password" required />
          <button type="button" class="toggle-pw" onclick="togglePassword('confirmPassword', this)" aria-label="Toggle confirm password visibility">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <p class="card-footer" style="margin-top:2px; text-align:left;">
        Already have an account? <a href="/login">Sign in</a>
      </p>
    </form>
  </div>

  <div class="cta-area">
    <button type="submit" form="registerForm" class="btn-primary">Create account</button>
  </div>

  <div class="toast" id="toast" style="display:none; position:fixed; bottom:calc(28px + var(--safe-b)); left:50%; transform:translateX(-50%); padding:12px 22px; border-radius:10px; font-size:0.88rem; font-weight:600; color:#fff; z-index:999; max-width:90%; text-align:center;"></div>

  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.innerHTML = isHidden
        ? `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88L6.59 6.59m7.532 7.532l3.29 3.29M3 3l18 18" />
           </svg>`
        : `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
           </svg>`;
    }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = type === 'success' ? '#1c8a4a' : '#b3121c';
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3500);
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(e.target);
      const body = new URLSearchParams(formData);

      try {
        const res = await fetch('/register', {
          method: 'POST',
          credentials: 'include',
          body
        });

        const data = await res.json();

        if (data.success) {
          showToast(data.message || 'Verification code sent!', 'success');
          setTimeout(() => {
            window.location.href = (data.data && data.data.redirectTo)
              ? data.data.redirectTo
              : `/verify-email?email=${encodeURIComponent(formData.get('email'))}`;
          }, 900);
        } else {
          showToast(data.message || 'Registration failed.', 'error');
        }
      } catch (err) {
        showToast('Network error. Please try again.', 'error');
      }
    });
  </script>

</body>
</html>
