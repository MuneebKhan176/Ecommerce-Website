<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>Faisalabad Textile Store — Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #f6f1e7;
            --card: #ffffff;
            --ink: #141414;
            --muted: #746f66;
            --border: #e7e0d3;
            --input-bg: #faf7f0;
            --red: #b3121c;
            --red-dark: #8c0e16;
            --red-soft: rgba(179, 18, 28, 0.08);
            --radius: 12px;
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* App-style header */
        .app-header {
            padding: calc(18px + var(--safe-t)) 20px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-mark {
            width: auto;          /* was 30px */
            min-width: 30px;
            height: 30px;
            padding: 0 8px;       /* gives 3-letter text breathing room */
            border-radius: 7px;
            background: var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-mark span {
            color: #fff;
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: 0.72rem;   /* was 0.95rem — smaller so 3 letters fit */
            letter-spacing: 0.3px;
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.4px;
        }

        /* Scrollable content area */
        .app-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px 20px 24px;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.65rem;
            font-weight: 800;
            margin-top: 10px;
        }

        .card-subtitle {
            font-size: 0.9rem;
            color: var(--muted);
            margin-top: 6px;
            margin-bottom: 22px;
        }

        /* Role tabs: User / Admin */
        .role-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .role-tab {
            border: none;
            background: transparent;
            padding: 12px 0;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--muted);
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            min-height: 44px;
        }

        .role-tab.active {
            background: var(--ink);
            color: #fff;
        }

        /* Form */
        .field { margin-bottom: 18px; }

        label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .input-wrap { position: relative; }

        input[type="email"],
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 15px 46px 15px 15px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            font-size: 16px; /* 16px minimum keeps iOS Safari from auto-zooming on focus */
            color: var(--ink);
            background: var(--input-bg);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            min-height: 52px;
        }

        input::placeholder { color: #a39d8f; }

        input:focus {
            border-color: var(--red);
            background: #fff;
            box-shadow: 0 0 0 3px var(--red-soft);
        }

        .eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #a39d8f;
            display: flex;
            align-items: center;
            padding: 10px;
            margin: -10px;
        }

        .eye-btn:hover { color: var(--red); }

        .row-forgot {
            display: flex;
            justify-content: flex-end;
            margin-top: -8px;
            margin-bottom: 16px;
        }

        .row-forgot a {
            font-size: 0.85rem;
            color: var(--red);
            font-weight: 600;
            text-decoration: none;
            padding: 6px 0;
        }

        .row-forgot a:hover { text-decoration: underline; }

        /* Sticky bottom CTA — thumb-friendly on mobile */
        .cta-area {
            padding: 14px 20px calc(16px + var(--safe-b));
            background: linear-gradient(180deg, rgba(246,241,231,0) 0%, var(--bg) 30%);
            position: sticky;
            bottom: 0;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.2px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 8px 20px rgba(179, 18, 28, 0.25);
            min-height: 52px;
        }

        .btn-primary:active { transform: scale(0.98); background: var(--red-dark); }

        .card-footer {
            text-align: center;
            margin-top: 16px;
            font-size: 0.88rem;
            color: var(--muted);
        }

        .card-footer a {
            color: var(--red);
            font-weight: 700;
            text-decoration: none;
        }

        .card-footer a:hover { text-decoration: underline; }

        #adminNotice {
            display: none;
            font-size: 0.8rem;
            color: var(--muted);
            text-align: center;
            margin-top: 16px;
            background: var(--input-bg);
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 10px 12px;
        }

        /* Toast */
        .toast {
            display: none;
            position: fixed;
            bottom: calc(28px + var(--safe-b));
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #fff;
            z-index: 999;
            max-width: 90%;
            text-align: center;
            animation: fadeUp 0.3s ease;
        }

        .toast.success { background: #1c8a4a; }
        .toast.error   { background: var(--red); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Slightly roomier on tablets/desktop, still centered */
        @media (min-width: 520px) {
            body { align-items: center; justify-content: center; }
            .app-header { display: none; }
            .app-content {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 18px;
                padding: 34px 32px 8px;
                box-shadow: 0 10px 40px rgba(20, 20, 20, 0.08);
                margin-top: 40px;
            }
            .card-title { margin-top: 0; text-align: center; }
            .card-subtitle { text-align: center; }
            .cta-area { position: static; background: none; padding: 14px 32px 32px; }
        }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="brand-mark"><span>FTD</span></div>
        <span class="brand-name">Faisalabad Texrile Depot</span>
    </div>

    <div class="app-content">
        <h1 class="card-title">Welcome back</h1>
        <p class="card-subtitle">Sign in to continue to your account.</p>

        <div class="role-tabs">
            <button type="button" class="role-tab active" id="userTab" onclick="setLoginType('user')">User</button>
            <button type="button" class="role-tab" id="adminTab" onclick="setLoginType('admin')">Admin</button>
        </div>

        <div class="field">
            <label for="identifier" id="identifierLabel">Email</label>
            <div class="input-wrap">
                <input type="email" id="identifier" placeholder="you@example.com" autocomplete="username" />
            </div>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
                <button class="eye-btn" type="button" onclick="togglePwd()" aria-label="Toggle password visibility">
                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477
                               0 8.268 2.943 9.542 7-1.274 4.057-5.065
                               7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="row-forgot">
            <a href="#">Forgot password?</a>
        </div>

        <p class="card-footer" id="registerFooter">
            Don't have an account? <a href="/register">Sign up</a>
        </p>

        <div id="adminNotice">Admin accounts are created by the store owner and can't be self-registered.</div>
    </div>

    <div class="cta-area">
        <button class="btn-primary" onclick="handleLogin()">Sign In</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let loginType = 'user';

        function setLoginType(type) {
            loginType = type;

            document.getElementById('userTab').classList.toggle('active', type === 'user');
            document.getElementById('adminTab').classList.toggle('active', type === 'admin');

            const identifierInput = document.getElementById('identifier');
            const identifierLabel = document.getElementById('identifierLabel');
            const registerFooter = document.getElementById('registerFooter');
            const adminNotice = document.getElementById('adminNotice');

            if (type === 'admin') {
                identifierLabel.textContent = 'Username';
                identifierInput.type = 'text';
                identifierInput.placeholder = 'admin_username';
                identifierInput.autocomplete = 'username';
                registerFooter.style.display = 'none';
                adminNotice.style.display = 'block';
            } else {
                identifierLabel.textContent = 'Email';
                identifierInput.type = 'email';
                identifierInput.placeholder = 'you@example.com';
                identifierInput.autocomplete = 'email';
                registerFooter.style.display = 'block';
                adminNotice.style.display = 'none';
            }

            identifierInput.value = '';
            document.getElementById('password').value = '';
        }

        function togglePwd() {
            const input = document.getElementById('password');
            const icon  = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477
                           0-8.268-2.943-9.542-7a9.956 9.956 0
                           012.293-3.95M6.938 6.938A9.956 9.956 0 0112
                           5c4.477 0 8.268 2.943 9.542 7a9.956 9.956 0
                           01-1.48 2.862M6.938 6.938L3 3m3.938
                           3.938l10.124 10.124M16.5 16.5L21 21"/>
                `;
            } else {
                input.type = 'password';
                icon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477
                           0 8.268 2.943 9.542 7-1.274 4.057-5.065
                           7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                `;
            }
        }

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${type}`;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3500);
        }

        async function handleLogin() {

            const identifier = document.getElementById('identifier').value.trim();
            const password    = document.getElementById('password').value.trim();

            if (!identifier || !password) {
                return showToast('Please fill in all fields.', 'error');
            }

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `loginType=${encodeURIComponent(loginType)}&identifier=${encodeURIComponent(identifier)}&password=${encodeURIComponent(password)}`
                });

                const data = await res.json();

                if (data.success) {
                    showToast('Login successful! Redirecting…', 'success');
                    const redirectUrl = (data.data && data.data.redirectTo) ? data.data.redirectTo : '/dashboard';
                    setTimeout(() => { window.location.href = redirectUrl; }, 1000);
                } else {
                    showToast(data.message || 'Login failed.', 'error');
                }
            } catch (err) {
                showToast('Network error. Please try again.', 'error');
            }
        }
    </script>
</body>
</html>
