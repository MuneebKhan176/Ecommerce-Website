<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>Faisalabad Textile Depot Admin — Users</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #f6f1e7;
            --card: #ffffff;
            --ink: #141414;
            --muted: #746f66;
            --border: #e7e0d3;
            --red: #b3121c;
            --red-dark: #8c0e16;
            --red-tint: rgba(179, 18, 28, 0.08);
            --green: #1e7e34;
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
        }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background:
                radial-gradient(1200px 400px at 15% -10%, rgba(179,18,28,0.06), transparent 60%),
                radial-gradient(900px 400px at 100% 0%, rgba(179,18,28,0.04), transparent 55%),
                var(--bg);
            color: var(--ink);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

        /* ===== Header ===== */
        .admin-header {
            background: linear-gradient(155deg, var(--ink) 0%, #221c17 100%);
            color: #fff;
            padding: calc(16px + var(--safe-t)) 20px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        .admin-header::after {
            content: '';
            position: absolute;
            right: -60px; top: -80px;
            width: 220px; height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(179,18,28,0.35), transparent 70%);
            pointer-events: none;
        }

        .admin-brand { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }

        .brand-mark {
            width: auto;          /* was 30px */
            min-width: 30px;
            height: 30px;
            padding: 0 8px;       /* gives 3-letter text breathing room */
            border-radius: 7px;
            background: var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    
        .brand-mark span {
            color: #fff;
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: 0.72rem;   /* was 0.95rem — smaller so 3 letters fit */
            letter-spacing: 0.3px;
        }
        .admin-brand-name { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 800; }
        .admin-tag {
            font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
            color: #ffb3b3; background: rgba(179, 18, 28, 0.25);
            padding: 4px 9px; border-radius: 999px;
        }
        .header-right { display: flex; align-items: center; gap: 16px; position: relative; z-index: 1; }
        .logout-link { color: #b8b3a8; font-size: 0.85rem; font-weight: 600; text-decoration: none; padding: 8px; }
        .logout-link:hover { color: #fff; }

        /* ===== Content shell ===== */
        .admin-content { flex: 1; padding: 22px 20px calc(28px + var(--safe-b)); max-width: 1100px; width: 100%; margin: 0 auto; }

        .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 700; color: var(--muted); text-decoration: none; margin-bottom: 14px; }
        .back-link:hover { color: var(--red); }

        .welcome { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .welcome h1 { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 800; }
        .welcome p { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

        /* ===== Summary card ===== */
        .summary-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 16px;
            padding: 18px 20px; margin-bottom: 20px;
            display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
        }
        .summary-icon {
            width: 46px; height: 46px; border-radius: 12px;
            background: linear-gradient(155deg, #fff, #faf2ee);
            border: 1px solid rgba(179,18,28,0.14);
            display: flex; align-items: center; justify-content: center;
            color: var(--red); flex-shrink: 0;
            box-shadow: 0 3px 10px rgba(179,18,28,0.1);
        }
        .summary-icon svg { width: 24px; height: 24px; }
        .summary-value {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 1.9rem; font-weight: 700; line-height: 1; color: var(--ink);
        }
        .summary-value.shimmer {
            color: transparent; border-radius: 5px;
            background: linear-gradient(90deg, #ece6d8 25%, #f6f1e7 50%, #ece6d8 75%);
            background-size: 200% 100%; animation: shimmer 1.3s infinite;
            display: inline-block; width: 56px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .summary-label { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

        .search-wrap { margin-left: auto; min-width: 220px; flex: 1; max-width: 320px; }
        .search-wrap input {
            width: 100%; background: #faf7f0; border: 1px solid var(--border); border-radius: 9px;
            padding: 10px 12px; font-size: 0.85rem; color: var(--ink); font-family: inherit;
        }
        .search-wrap input:focus { outline: 2px solid var(--red); outline-offset: -1px; }

        /* ===== Users table/list ===== */
        .users-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }

        .users-table { width: 100%; border-collapse: collapse; }
        .users-table th {
            text-align: left; font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--muted); padding: 12px 18px; border-bottom: 1px solid var(--border); background: #faf7f0;
        }
        .users-table td { padding: 13px 18px; border-bottom: 1px solid var(--border); font-size: 0.85rem; vertical-align: middle; }
        .users-table tr:last-child td { border-bottom: none; }

        .user-name { font-weight: 700; }
        .user-email, .user-phone { color: var(--muted); font-size: 0.82rem; }
        .user-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--red-tint); color: var(--red);
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 0.78rem; flex-shrink: 0; margin-right: 10px;
        }
        .name-cell { display: flex; align-items: center; }

        @media (max-width: 680px) {
            .users-table thead { display: none; }
            .users-table, .users-table tbody, .users-table tr, .users-table td { display: block; width: 100%; }
            .users-table tr { padding: 14px 18px; border-bottom: 1px solid var(--border); }
            .users-table td { padding: 3px 0; border-bottom: none; }
            .name-cell { margin-bottom: 4px; }
        }

        .empty-row { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 0.88rem; }
        .state-error { color: var(--red); text-align: center; padding: 40px 20px; font-size: 0.85rem; }

        .toast {
            position: fixed; left: 50%; bottom: calc(24px + var(--safe-b));
            transform: translateX(-50%) translateY(20px);
            background: var(--ink); color: #fff;
            padding: 11px 18px; border-radius: 10px; font-size: 0.82rem;
            opacity: 0; transition: opacity 0.2s, transform 0.2s;
            z-index: 200; pointer-events: none; max-width: 90%; text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <header class="admin-header">
        <div class="admin-brand">
            <div class="brand-mark"><span>FTD</span></div>
            <span class="admin-brand-name">Faisalabad Textile Depot</span>
            <span class="admin-tag">Admin</span>
        </div>
        <div class="header-right">
            <a href="/logout" class="logout-link">Log out</a>
        </div>
    </header>

    <main class="admin-content">
        <a href="/admin/dashboard" class="back-link">&#8249; Back to dashboard</a>

        <div class="welcome">
            <div>
                <h1>Users</h1>
                <p>Every account registered on the store.</p>
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <div>
                <span class="summary-value shimmer" id="total-users">—</span>
                <div class="summary-label">Registered accounts</div>
            </div>
            <div class="search-wrap">
                <input type="text" id="searchInput" placeholder="Search by name, email, or phone" />
            </div>
        </div>

        <div class="users-box">
            <table class="users-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                    </tr>
                </thead>
                <tbody id="usersBody">
                    <tr><td colspan="3"><div class="empty-row">Loading users…</div></td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        function showToast(message) {
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.className = 'toast';
                document.body.appendChild(toast);
            }
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function initials(name) {
            if (!name) return '?';
            const parts = name.trim().split(/\s+/);
            return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase();
        }

        async function adminFetch(url) {
            try {
                const res = await fetch(url, { credentials: 'include' });
                let body;
                try { body = await res.json(); } catch { body = { success: false, message: 'Invalid server response' }; }

                if (res.status === 401 || res.status === 403) {
                    showToast(body.message || 'Session expired — please log in again');
                    setTimeout(() => (window.location.href = '/login'), 1200);
                    return null;
                }
                return body;
            } catch {
                return { success: false, message: 'Network error', data: null };
            }
        }

        function renderUsers(users) {
            const body = document.getElementById('usersBody');
            if (!users.length) {
                body.innerHTML = `<tr><td colspan="3"><div class="empty-row">No users found.</div></td></tr>`;
                return;
            }
            body.innerHTML = users.map(u => `
                <tr>
                    <td>
                        <div class="name-cell">
                            <span class="user-avatar">${escapeHtml(initials(u.full_name))}</span>
                            <span class="user-name">${escapeHtml(u.full_name)}</span>
                        </div>
                    </td>
                    <td class="user-email">${escapeHtml(u.email)}</td>
                    <td class="user-phone">${escapeHtml(u.phone || '—')}</td>
                </tr>
            `).join('');
        }

        let searchTimer = null;

        async function loadUsers(search = '') {
            const totalEl = document.getElementById('total-users');
            const body = document.getElementById('usersBody');
            body.innerHTML = `<tr><td colspan="3"><div class="empty-row">Loading users…</div></td></tr>`;

            const qs = search ? `?search=${encodeURIComponent(search)}&limit=200` : '?limit=200';
            const res = await adminFetch(`/admin/api/users${qs}`);

            if (!res || !res.success) {
                body.innerHTML = `<tr><td colspan="3"><div class="state-error">Could not load users</div></td></tr>`;
                return;
            }

            const { users, pagination } = res.data;
            totalEl.classList.remove('shimmer');
            totalEl.textContent = pagination.total;
            renderUsers(users);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            const value = e.target.value.trim();
            searchTimer = setTimeout(() => loadUsers(value), 300);
        });

        loadUsers();
    </script>

</body>
</html>
