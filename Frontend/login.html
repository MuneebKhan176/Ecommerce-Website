<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>Admin Sign In — Faisalabad Textile Depot</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #f6f1e7;
            --card: #ffffff;
            --ink: #141414;
            --muted: #746f66;
            --border: #e7e0d3;
            --input-bg: #faf7f0;
            --red: #b3121c;
            --red-dark: #8c0e16;
            --red-soft: rgba(179, 18, 28, 0.08);
            --radius: 12px;
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
        }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .app-header {
            padding: calc(18px + var(--safe-t)) 20px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-mark {
            width: auto; min-width: 30px; height: 30px; padding: 0 8px;
            border-radius: 7px; background: var(--red);
            display: flex; align-items: center; justify-content: center;
        }
        .brand-mark span {
            color: #fff; font-family: 'Playfair Display', serif; font-weight: 800;
            font-size: 0.72rem; letter-spacing: 0.3px;
        }
        .brand-name { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 800; letter-spacing: 0.4px; }

        .app-content {
            flex: 1; display: flex; flex-direction: column;
            padding: 8px 20px 24px; width: 100%; max-width: 460px; margin: 0 auto;
        }

        .card-title { font-family: 'Playfair Display', serif; font-size: 1.65rem; font-weight: 800; margin-top: 10px; }
        .card-subtitle { font-size: 0.9rem; color: var(--muted); margin-top: 6px; margin-bottom: 26px; }

        .field { margin-bottom: 18px; }
        label { display: block; font-size: 0.88rem; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
        .input-wrap { position: relative; }

        input[type="text"], input[type="password"] {
            width: 100%; padding: 15px 46px 15px 15px; border: 1.5px solid var(--border);
            border-radius: var(--radius); font-size: 16px; color: var(--ink); background: var(--input-bg);
            outline: none; transition: border-color 0.2s, box-shadow 0.2s; min-height: 52px;
        }
        input::placeholder { color: #a39d8f; }
        input:focus { border-color: var(--red); background: #fff; box-shadow: 0 0 0 3px var(--red-soft); }

        .eye-btn {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: #a39d8f;
            display: flex; align-items: center; padding: 10px; margin: -10px;
        }
        .eye-btn:hover { color: var(--red); }

        .cta-area {
            padding: 14px 20px calc(16px + var(--safe-b));
            background: linear-gradient(180deg, rgba(246,241,231,0) 0%, var(--bg) 30%);
            position: sticky; bottom: 0; width: 100%; max-width: 460px; margin: 0 auto;
        }

        .btn-primary {
            width: 100%; padding: 16px; background: var(--red); color: #fff; border: none;
            border-radius: var(--radius); font-size: 1rem; font-weight: 700; cursor: pointer;
            letter-spacing: 0.2px; transition: background 0.2s, transform 0.1s;
            box-shadow: 0 8px 20px rgba(179, 18, 28, 0.25); min-height: 52px;
        }
        .btn-primary:active { transform: scale(0.98); background: var(--red-dark); }

        .card-footer {
            text-align: center; margin-top: 18px; font-size: 0.8rem; color: var(--muted);
        }
        .card-footer a { color: var(--red); font-weight: 700; text-decoration: none; }
        .card-footer a:hover { text-decoration: underline; }

        .toast {
            display: none; position: fixed; bottom: calc(28px + var(--safe-b)); left: 50%;
            transform: translateX(-50%); padding: 12px 22px; border-radius: 10px;
            font-size: 0.88rem; font-weight: 600; color: #fff; z-index: 999;
            max-width: 90%; text-align: center; animation: fadeUp 0.3s ease;
        }
        .toast.success { background: #1c8a4a; }
        .toast.error { background: var(--red); }
        @keyframes fadeUp { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

        @media (min-width: 520px) {
            body { align-items: center; justify-content: center; }
            .app-header { display: none; }
            .app-content {
                background: var(--card); border: 1px solid var(--border); border-radius: 18px;
                padding: 34px 32px 8px; box-shadow: 0 10px 40px rgba(20, 20, 20, 0.08); margin-top: 40px;
            }
            .card-title { margin-top: 0; text-align: center; }
            .card-subtitle { text-align: center; }
            .cta-area { position: static; background: none; padding: 14px 32px 32px; }
        }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="brand-mark"><span>FTD</span></div>
        <span class="brand-name">Faisalabad Textile Depot</span>
    </div>

    <div class="app-content">
        <h1 class="card-title">Admin Sign In</h1>
        <p class="card-subtitle">Staff access only — customers don't need an account to shop or check out.</p>

        <div class="field">
            <label for="identifier">Username</label>
            <div class="input-wrap">
                <input type="text" id="identifier" placeholder="admin_username" autocomplete="username" />
            </div>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
                <button class="eye-btn" type="button" onclick="togglePwd()" aria-label="Toggle password visibility">
                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477
                               0 8.268 2.943 9.542 7-1.274 4.057-5.065
                               7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>
        </div>

        <p class="card-footer">Not staff? <a href="/">Return to the store</a></p>
    </div>

    <div class="cta-area">
        <button class="btn-primary" onclick="handleLogin()">Sign In</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function togglePwd() {
            const input = document.getElementById('password');
            const icon  = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477
                           0-8.268-2.943-9.542-7a9.956 9.956 0
                           012.293-3.95M6.938 6.938A9.956 9.956 0 0112
                           5c4.477 0 8.268 2.943 9.542 7a9.956 9.956 0
                           01-1.48 2.862M6.938 6.938L3 3m3.938
                           3.938l10.124 10.124M16.5 16.5L21 21"/>
                `;
            } else {
                input.type = 'password';
                icon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477
                           0 8.268 2.943 9.542 7-1.274 4.057-5.065
                           7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                `;
            }
        }

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${type}`;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3500);
        }

        async function handleLogin() {
            const identifier = document.getElementById('identifier').value.trim();
            const password    = document.getElementById('password').value.trim();

            if (!identifier || !password) {
                return showToast('Please fill in all fields.', 'error');
            }

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `identifier=${encodeURIComponent(identifier)}&password=${encodeURIComponent(password)}`
                });

                const data = await res.json();

                if (data.success) {
                    showToast('Login successful! Redirecting…', 'success');
                    const redirectUrl = (data.data && data.data.redirectTo) ? data.data.redirectTo : '/admin/dashboard';
                    setTimeout(() => { window.location.href = redirectUrl; }, 800);
                } else {
                    showToast(data.message || 'Login failed.', 'error');
                }
            } catch (err) {
                showToast('Network error. Please try again.', 'error');
            }
        }

        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
